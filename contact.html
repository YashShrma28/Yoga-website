<html>
    <head>
        
    
        <title>Contact Form</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <style>

   /* =========================
   BASIC RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Georgia, 'Times New Roman', serif;
    color: #31543b;
}


/* =========================
   CONTACT SECTION
========================= */

.contact-section {

    min-height: 100vh;

    padding: 70px 6%;

    position: relative;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 10% 20%,
            #e4ead5 0%,
            transparent 25%
        ),
        radial-gradient(
            circle at 95% 80%,
            #e3ead6 0%,
            transparent 25%
        ),
        linear-gradient(
            135deg,
            #f8f1e4,
            #f2eadb
        );
}


/* =========================
   MAIN CONTAINER
========================= */

.contact-container {

    max-width: 1250px;

    margin: auto;

    display: grid;

    grid-template-columns: 0.8fr 1.2fr;

    gap: 60px;

    align-items: center;

    position: relative;

    z-index: 2;
}


/* =========================
   LEFT CONTENT
========================= */

.contact-info {
    padding: 30px;
}

.small-title {

    font-family: Arial, sans-serif;

    font-size: 15px;

    font-weight: 600;

    letter-spacing: 4px;

    margin-bottom: 25px;

    color: #456a4d;
}


.contact-info h1 {

    font-size: clamp(55px, 6vw, 82px);

    line-height: 0.98;

    color: #28533a;

    margin-bottom: 35px;
}


.description {

    max-width: 360px;

    font-family: Arial, sans-serif;

    font-size: 19px;

    line-height: 1.7;

    color: #48644e;
}


/* =========================
   LOTUS
========================= */

.lotus {

    margin-top: 35px;

    font-size: 38px;

    text-align: left;
}


.yoga-symbol {

    margin-top: 25px;

    width: 190px;
    height: 150px;

    display: flex;

    justify-content: center;

    align-items: center;

    border-radius: 50%;

    background: rgba(220, 190, 130, 0.25);

    font-size: 85px;
}


/* =========================
   FORM BOX
========================= */

.form-box {

    padding: 42px;

    background: rgba(255, 255, 255, 0.72);

    border: 2px solid rgba(190, 163, 116, 0.28);

    border-radius: 28px;

    box-shadow:
        0 25px 60px rgba(72, 78, 55, 0.15);

    backdrop-filter: blur(12px);
}


/* =========================
   FORM HEADING
========================= */

.form-lotus {

    text-align: center;

    font-size: 35px;

    margin-bottom: 8px;
}


.form-box h2 {

    text-align: center;

    font-size: 48px;

    font-style: italic;

    color: #4f7045;

    margin-bottom: 10px;
}


.form-subtitle {

    text-align: center;

    font-family: Arial, sans-serif;

    color: #526553;

    font-size: 15px;

    margin-bottom: 20px;
}


.line {

    width: 60px;

    height: 2px;

    background: #70845a;

    margin: 0 auto 25px;
}


/* =========================
   INPUTS
========================= */

.form-box input,
.form-box select,
.form-box textarea {

    width: 100%;

    padding: 17px 18px;

    margin-bottom: 15px;

    border: 1px solid #ccd5c2;

    border-radius: 18px;

    background: rgba(235, 239, 227, 0.8);

    color: #31543b;

    font-size: 16px;

    font-family: Arial, sans-serif;

    outline: none;

    transition: 0.3s ease;
}


/* =========================
   PLACEHOLDER
========================= */

.form-box input::placeholder,
.form-box textarea::placeholder {

    color: #617060;
}


/* =========================
   FOCUS EFFECT
========================= */

.form-box input:focus,
.form-box select:focus,
.form-box textarea:focus {

    border-color: #71885d;

    background: #f8faf4;

    box-shadow:
        0 0 0 4px rgba(113, 136, 93, 0.12);

    transform: translateY(-1px);
}


/* =========================
   TEXTAREA
========================= */

.form-box textarea {

    resize: vertical;

    min-height: 115px;
}


/* =========================
   BUTTON
========================= */

.form-box button {

    width: 100%;

    padding: 17px;

    border: none;

    border-radius: 30px;

    background: linear-gradient(
        135deg,
        #3f7954,
        #285f3d
    );

    color: white;

    font-size: 17px;

    font-weight: 600;

    font-family: Arial, sans-serif;

    cursor: pointer;

    transition: 0.3s ease;

    box-shadow:
        0 10px 20px rgba(47, 94, 61, 0.22);
}


.form-box button:hover {

    transform: translateY(-3px);

    box-shadow:
        0 15px 28px rgba(47, 94, 61, 0.30);

    background: linear-gradient(
        135deg,
        #2e6844,
        #204e32
    );
}


/* =========================
   THANK YOU
========================= */

.thank-you {

    margin-top: 35px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 15px;

    color: #557347;

    font-size: 34px;

    font-style: italic;
}


.thank-you span {

    width: 80px;

    height: 1px;

    background: #7d8e69;
}


.heart {

    text-align: center;

    margin-top: 8px;

    font-size: 22px;

    color: #426746;
}


/* =========================
   DECORATIVE LEAVES
========================= */

.leaf {

    position: absolute;

    font-size: 100px;

    opacity: 0.18;

    z-index: 1;
}


.leaf-top {

    top: -20px;

    right: 20px;

    transform: rotate(-25deg);
}


.leaf-bottom {

    bottom: -25px;

    left: 10px;

    transform: rotate(20deg);
}


/* =========================
   TABLET
========================= */

@media (max-width: 900px) {

    .contact-container {

        grid-template-columns: 1fr;

        gap: 30px;

        max-width: 650px;
    }

    .contact-info {

        text-align: center;

        padding: 10px;
    }

    .contact-info h1 {

        font-size: 58px;
    }

    .description {

        margin: auto;
    }

    .lotus {

        text-align: center;
    }

    .yoga-symbol {

        margin: 20px auto;
    }
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .contact-section {

        padding: 40px 14px;
    }


    .contact-container {

        width: 100%;

        gap: 25px;
    }


    .contact-info {

        padding: 10px 5px;
    }


    .small-title {

        font-size: 12px;

        letter-spacing: 2.5px;

        margin-bottom: 15px;
    }


    .contact-info h1 {

        font-size: 47px;

        line-height: 1.02;

        margin-bottom: 20px;
    }


    .description {

        font-size: 16px;

        line-height: 1.6;
    }


    .lotus {

        font-size: 30px;

        margin-top: 20px;
    }


    .yoga-symbol {

        width: 130px;

        height: 100px;

        font-size: 60px;
    }


    /* FORM */

    .form-box {

        padding: 28px 18px;

        border-radius: 23px;
    }


    .form-lotus {

        font-size: 28px;
    }


    .form-box h2 {

        font-size: 35px;
    }


    .form-subtitle {

        font-size: 13px;

        line-height: 1.5;

        padding: 0 10px;
    }


    .form-box input,
    .form-box select,
    .form-box textarea {

        padding: 15px;

        font-size: 14px;

        border-radius: 15px;

        margin-bottom: 13px;
    }


    .form-box button {

        padding: 15px;

        font-size: 15px;
    }


    .thank-you {

        font-size: 27px;

        gap: 8px;
    }


    .thank-you span {

        width: 40px;
    }


    .leaf {

        font-size: 65px;
    }
}


/* =========================
   VERY SMALL MOBILE
========================= */

@media (max-width: 380px) {

    .contact-info h1 {

        font-size: 40px;
    }


    .form-box {

        padding: 24px 14px;
    }


    .form-box h2 {

        font-size: 31px;
    }
}
</style>




<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | Yoga With Neetu</title>
    
</head>

<body>

<section class="contact-section">

    <!-- Decorative leaves -->
    <div class="leaf leaf-top">🌿</div>
    <div class="leaf leaf-bottom">🌿</div>

    <div class="contact-container">

        <!-- LEFT SIDE -->
        <div class="contact-info">

            <p class="small-title">CONNECT WITH US</p>

            <h1>
                Book Your<br>
                Yoga<br>
                Session
            </h1>

            <p class="description">
                Take the first step towards a healthier,
                happier and more peaceful you.
            </p>

            <div class="lotus">🪷</div>

            <div class="yoga-symbol">
                🧘
            </div>

        </div>


        <!-- RIGHT SIDE FORM -->
        <div class="form-box">

            <div class="form-lotus">🪷</div>

            <h2>Get In Touch</h2>

            <p class="form-subtitle">
                Fill in the details below and we'll get back to you soon.
            </p>

            <div class="line"></div>


            <form
                action="https://formspree.io/f/mdawlzel"
                method="POST"
            >

                <!-- Name -->
                <input
                    type="text"
                    name="Name"
                    placeholder="Full Name"
                    required
                >


                <!-- Email -->
                <input
                    type="email"
                    name="Email"
                    placeholder="Email"
                    required
                >


                <!-- Phone -->
                <input
                    type="tel"
                    name="Phone Number"
                    placeholder="Phone number"
                    required
                    pattern="[0-9]{10}"
                    title="please enter a valid 10-digit phone number"    
                                >


                <!-- Class -->
                <select name="Class" required>

                    <option value="" disabled selected>
                        Select Class
                    </option>

                    <option value="Group Class">
                        Group Class
                    </option>

                    <option value="Personal Class">
                        Personal Class
                    </option>

                </select>


                <!-- Gender -->
                <select name="Gender" required>

                    <option value="" disabled selected>
                        Select Gender
                    </option>

                    <option value="Male">
                        Male
                    </option>

                    <option value="Female">
                        Female
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>


                <!-- Country -->
                <select name="Country" required>

                    <option value="" disabled selected>
                        Country
                    </option>

                    <option value="India">
                        India
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>


                <!-- Message -->
                <textarea
                    name="Message"
                    placeholder="Message"
                    rows="4"
                ></textarea>


                <!-- Button -->
                <button type="submit">
                    ✈ &nbsp; Send Message
                </button>

            </form>


            <div class="thank-you">
                <span></span>
                Thank You!
                <span></span>
            </div>

            <div class="heart">♥</div>

        </div>

    </div>

</section>

</body>
</html>
